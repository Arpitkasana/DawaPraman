<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verified Medicine Batch Numbers | DawaPraman</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #f8fafc; color: #0f172a; }
    header { background: #047857; color: white; padding: 18px 16px; }
    main { max-width: 900px; margin: 24px auto; padding: 0 16px 40px; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .subtitle { margin: 0; opacity: .85; font-size: 13px; }
    .toolbar { display: flex; gap: 8px; margin: 16px 0; }
    input { flex: 1; min-width: 0; border: 1px solid #cbd5e1; border-radius: 10px; padding: 11px 12px; }
    button { border: 0; border-radius: 10px; background: #059669; color: white; font-weight: 700; padding: 10px 14px; }
    button:disabled { opacity: .45; }
    .meta { color: #64748b; font-size: 12px; margin-bottom: 10px; }
    .list { display: grid; gap: 8px; }
    .card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; }
    .batch { color: #047857; font-family: ui-monospace, monospace; font-weight: 800; }
    .name { margin-top: 4px; font-weight: 700; }
    .dates { color: #64748b; font-size: 12px; margin-top: 5px; }
    .pager { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
    .empty { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; text-align: center; color: #64748b; }
  </style>
</head>
<body>
  <header>
    <h1>DawaPraman Batch Directory</h1>
    <p class="subtitle">Search and verify medicine batch numbers</p>
  </header>
  <main>
    <div class="toolbar">
      <input id="search" placeholder="Search batch number or medicine name" />
      <button id="searchBtn">Search</button>
    </div>
    <div id="meta" class="meta">Loading…</div>
    <div id="list" class="list"></div>
    <div class="pager">
      <button id="prev">Previous</button>
      <span id="page" class="meta"></span>
      <button id="next">Next</button>
    </div>
  </main>
  <script>
    const SUPABASE_URL = window.location.origin.includes('localhost')
      ? ''
      : '__SUPABASE_URL__';
    let page = 1;
    const pageSize = 50;

    async function load() {
      const search = document.getElementById('search').value.trim();
      document.getElementById('meta').textContent = 'Loading…';
      try {
        const response = await fetch(`${SUPABASE_URL}/functions/v1/list-batches`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ search, page, pageSize })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Unable to load batch numbers');

        const list = document.getElementById('list');
        list.innerHTML = '';
        if (!data.batches?.length) {
          list.innerHTML = '<div class="empty">No batch numbers found.</div>';
        } else {
          list.innerHTML = data.batches.map((row) => `
            <article class="card">
              <div class="batch">${escapeHtml(row.batch_no)}</div>
              <div class="name">${escapeHtml(row.medicine_name)}</div>
              <div class="dates">Mfg: ${escapeHtml(row.mfg_date || '—')} · Exp: ${escapeHtml(row.exp_date || '—')}</div>
            </article>
          `).join('');
        }

        document.getElementById('meta').textContent = `Showing page ${data.page} · ${data.total ?? data.batches.length} batch records`;
        document.getElementById('page').textContent = `Page ${page}`;
        document.getElementById('prev').disabled = page <= 1;
        document.getElementById('next').disabled = data.batches.length < pageSize;
      } catch (error) {
        document.getElementById('meta').textContent = '';
        document.getElementById('list').innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
      }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[char]);
    }

    document.getElementById('searchBtn').addEventListener('click', () => { page = 1; load(); });
    document.getElementById('search').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') { page = 1; load(); }
    });
    document.getElementById('prev').addEventListener('click', () => { page--; load(); });
    document.getElementById('next').addEventListener('click', () => { page++; load(); });
    load();
  </script>
</body>
</html>
